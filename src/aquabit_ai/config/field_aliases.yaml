# Декларативный реестр канонических полей, допустимых алиасов заголовков CSV AquaBit,
# правил линейного перевода единиц и допустимых enum-значений (§4, п. 3.2–3.4).
# Обновлено по результатам аудита реальных выгрузок AquaBit («Темино», «Куляб», «Модель сетей»).

schema_version: "1.2"

recognized_unit_suffixes:
  - "_m"
  - "_mm"
  - "_km"
  - "_m3_h"
  - "_m3_s"
  - "_m3"
  - "_l_s"
  - "_l_min"
  - "_bar"
  - "_mpa"
  - "_kpa"
  - "_m_s"
  - "_iso8601"
  - "_s"
  - "_sec"
  - "_min"
  - "_h"
  - "_pct"
  - "_kw"

# Линейные коэффициенты перевода неканонических единиц измерения (только размерности, НЕ гидравлика!)
unit_conversions:
  l_s_to_m3_h:
    from_unit: "l_s"
    to_unit: "m3_h"
    multiplier: 3.6
  m3_s_to_m3_h:
    from_unit: "m3_s"
    to_unit: "m3_h"
    multiplier: 3600.0
  l_min_to_m3_h:
    from_unit: "l_min"
    to_unit: "m3_h"
    multiplier: 0.06
  km_to_m:
    from_unit: "km"
    to_unit: "m"
    multiplier: 1000.0
  kpa_to_bar:
    from_unit: "kpa"
    to_unit: "bar"
    multiplier: 0.01
  mpa_to_bar:
    from_unit: "mpa"
    to_unit: "bar"
    multiplier: 10.0
  m_to_mm:
    from_unit: "m"
    to_unit: "mm"
    multiplier: 1000.0

# Колонки с явной неканонической единицей -> целевая каноническая колонка и правило конвертации
non_canonical_unit_columns:
  flow_l_s:
    target_canonical: "flow_m3_h"
    conversion: "l_s_to_m3_h"
    is_hydraulic_quantity: true
  Расход в л/с:
    target_canonical: "flow_m3_h"
    conversion: "l_s_to_m3_h"
    is_hydraulic_quantity: true
  demand_l_s:
    target_canonical: "demand_m3_h"
    conversion: "l_s_to_m3_h"
    is_hydraulic_quantity: true
  base_demand_l_s:
    target_canonical: "base_demand_m3_h"
    conversion: "l_s_to_m3_h"
    is_hydraulic_quantity: true
  length_km:
    target_canonical: "length_m"
    conversion: "km_to_m"
    is_hydraulic_quantity: false
  Длина в км:
    target_canonical: "length_m"
    conversion: "km_to_m"
    is_hydraulic_quantity: false
  pressure_kpa:
    target_canonical: "pressure_bar"
    conversion: "kpa_to_bar"
    is_hydraulic_quantity: true
  pressure_mpa:
    target_canonical: "pressure_bar"
    conversion: "mpa_to_bar"
    is_hydraulic_quantity: true
  diameter_m:
    target_canonical: "diameter_mm"
    conversion: "m_to_mm"
    is_hydraulic_quantity: false

