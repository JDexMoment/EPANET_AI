table_specific_aliases:
  sources.csv:
    Расчетный напор: "head_m"
    Расчётный напор: "head_m"
  demands.csv:
    ID: "node_id"
    Потребление: "base_demand_m3_h"
    График: "curve_id"
  irregularity_curves.csv:
    ID: "curve_id"
    Данные: "multiplier"
  pump_curves.csv:
