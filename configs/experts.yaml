# ─────────────────────────────────────────────────────────────
# experts.yaml — кто размечает, кто проверяет
# ─────────────────────────────────────────────────────────────
experts:
  - id: exp_01
    name: "Гидравлик 1"
    role: "ведущий инженер-гидравлик"
    email: "—"
  - id: exp_02
    name: "Гидравлик 2"
    role: "инженер-гидравлик"
    email: "—"

review:
  reviewer_id: exp_01             # принимает кейсы второго эксперта
  double_annotation_every: 7      # каждый 7-й сценарий размечают оба (контроль качества, IQA)
  min_time_per_scenario_min: 15   # норматив: не быстрее 15 минут на сценарий

load:
  scenarios_per_batch: 8          # сколько сценариев в одной партии (1 партия ≈ 1-2 вечера)
  report_cases_per_batch: 2       # из них с полным «золотым отчётом»
